amcl:
  ros__parameters:
    # Odometry noise model parameters (OmniMotionModel). 
    # Reduced from 0.5 to prevent the particle cloud from expanding chaotically during rotation.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    
    # Beam skipping config: Helps ignore dynamic obstacles (e.g., people walking past)
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    
    # Laser model settings
    laser_model_type: "likelihood_field"
    laser_min_range: 0.1
    laser_max_range: 10.0
    max_beams: 150
    
    # Strict scoring distance. Forces AMCL to penalize particles that aren't 
    # closely aligned with real geometric walls, preventing false locks.
    laser_likelihood_max_dist: 1.5
    
    # Particle filter population control. 
    # Max raised significantly to cover the entire free space during global seeding.
    # Min lowered to allow a very tight, efficient cluster once converged.
    max_particles: 15000
    min_particles: 1000
    
    # Filter error metrics
    pf_err: 0.05
    pf_z: 0.99
    
    # Recovery parameters: Helps AMCL inject random particles if it realizes it's lost
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    
    # Resample on every single filter update cycle
    resample_interval: 1
    
    # Kinematic model for your omnidirectional drivetrain
    robot_model_type: "nav2_amcl::OmniMotionModel"
    
    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 0.5
    
    # Aggressive update thresholds. Forces AMCL to recalculate particle weights 
    # every ~1.1 degrees of rotation or 2cm of travel, allowing rapid matching.
    update_min_a: 0.02
    update_min_d: 0.02
    
    # Laser model mixture weights
    z_hit: 0.6
    z_max: 0.05
    z_rand: 0.3
    z_short: 0.05
    lambda_short: 0.1
    sigma_hit: 0.25
    
    scan_topic: "scan"
    
    # Global initialization setup
    set_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
