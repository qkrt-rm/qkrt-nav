controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    failure_tolerance: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.01
    progress_checker_plugin: "progress_checker"
    odom_topic: /odometry/filtered
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.01
      movement_time_allowance: 90.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.15
      stateful: true

    FollowPath:
      plugin: "nav2_omni_pursuit_controller::OmniPursuitController"
      desired_linear_vel: 0.25
      lookahead_dist: 0.10
      max_angular_vel: 0.0
      approach_velocity_scaling_dist: 0.35
      min_approach_linear_velocity: 0.08
      transform_tolerance: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.8
      use_sim_time: true
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.03
      footprint: "[[0.30, 0.24], [0.24, 0.30], [-0.24, 0.30], [-0.30, 0.24], [-0.30, -0.24], [-0.24, -0.30], [0.24, -0.30], [0.30, -0.24]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter", "filter_inflation"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.5
        inflation_radius: 0.32
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
        override_lethal_cost: true
        lethal_override_cost: 200.0
      filter_inflation:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.20
        cost_scaling_factor: 8.0
      always_send_full_costmap: true
      footprint_clearing_enabled: true
