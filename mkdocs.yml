# Builds a website from the GitHub wiki (qkrt-rm/qkrt-nav.wiki).
# The wiki stays the single source of truth: edit pages there, not here.
#
# Local preview:
#   git clone https://github.com/qkrt-rm/qkrt-nav.wiki.git wiki   (or symlink an existing clone to ./wiki)
#   pip install mkdocs-material
#   mkdocs serve
#
# Deployment happens automatically via .github/workflows/docs.yml.

site_name: QKRT AutoNav Docs
site_url: https://qkrt-rm.github.io/qkrt-nav/
repo_url: https://github.com/qkrt-rm/qkrt-nav
repo_name: qkrt-rm/qkrt-nav
edit_uri: ""

docs_dir: wiki
exclude_docs: |
  _Sidebar.md
  _Footer.md
  .git/

hooks:
  - docs_hooks/wiki.py

theme:
  name: material
  custom_dir: docs_hooks/overrides
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/robot-industrial
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        # GitHub-style ```math blocks
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format {kwds: {mode: generic, tag: div}}
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - docs_hooks/extra.css

extra_javascript:
  - docs_hooks/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

validation:
  links:
    anchors: warn

# The site navigation is generated from the wiki's _Sidebar.md (see docs_hooks/wiki.py).
# To add a page to the site, add it to _Sidebar.md on the wiki.
