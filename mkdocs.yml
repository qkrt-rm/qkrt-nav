# Builds a website from the GitHub wiki (qkrt-rm/qkrt-nav.wiki).
# The wiki stays the single source of truth: edit pages there, not here.
#
# Local preview:
#   git clone https://github.com/qkrt-rm/qkrt-nav.wiki.git wiki   (or symlink an existing clone to ./wiki)
#   pip install mkdocs-material
#   mkdocs serve
#
# Deployment happens automatically via .github/workflows/docs.yml.

site_name: QKRT AutoNav Docs
site_url: https://qkrt-rm.github.io/qkrt-nav/
repo_url: https://github.com/qkrt-rm/qkrt-nav
repo_name: qkrt-rm/qkrt-nav
edit_uri: ""

docs_dir: wiki
exclude_docs: |
  _Sidebar.md
  _Footer.md
  .git/

hooks:
  - docs_hooks/wiki.py

theme:
  name: material
  custom_dir: docs_hooks/overrides
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/robot-industrial
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        # GitHub-style ```math blocks
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format {kwds: {mode: generic, tag: div}}
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - docs_hooks/extra.css

extra_javascript:
  - docs_hooks/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

validation:
  links:
    anchors: warn

# Mirrors _Sidebar.md in the wiki. Add new pages here too.
nav:
  - Home: Home.md
  - Future Ideas: Future-Ideas.md
  - Environment Setup:
      - Ubuntu VM Installation: Ubuntu-VM-Installation.md
  - Tutorials:
      - ROS2 Tutorial (Python): ROS2-Tutorial-(Python).md
      - ROS2 Tutorial (C++): ROS2-Tutorial-(C--).md
  - Concepts:
      - ROS2 Basics: ROS2-Basics.md
      - TF, URDF and Gazebo: TF,-URDF-and-Gazebo.md
      - Path Planning: Path-Planning.md
      - Path Execution: Path-Execution.md
      - Costmaps and Obstacle Avoidance: Costmaps-and-Obstacle-Avoidance.md
      - Sensing: Interoceptive-and-Exteroceptive-Sensing.md
      - Localization: Localization.md
      - Behavior Trees: Behavior-Trees.md
      - Nav2 Architecture: Nav2-Architecture.md
      - Full Stack Overview: Full-Stack-Overview.md
  - Our Code:
      - System Architecture: System-Architecture.md
      - sentry_bringup: sentry_bringup.md
      - sentry_communication: sentry_communication.md
      - sentry_description: sentry_description.md
      - sentry_localization: sentry_localization.md
      - sentry_navigation: sentry_navigation.md
      - omni_pursuit_controller: omni_pursuit_controller.md
  - Hardware & Status:
      - Setup and Operation: Setup-and-Operation.md
      - README (status & bugs): https://github.com/qkrt-rm/qkrt-nav#readme
